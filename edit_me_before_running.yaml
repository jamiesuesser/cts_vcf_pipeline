# =====================================================================
#  EDIT ME BEFORE RUNNING
#  CTS exon-capture VCF pipeline
#
#  Every setting the pipeline needs is in this file.
#    Section 1 - change for every run
#    Section 2 - reference genome + target BED (set once)
#    Section 3 - thresholds
#    Section 4 - cluster / email (set once)
# 
#    Use full paths starting with /
#
#  HOW TO RUN (copy/paste from any folder, on tinkercliffs2):
#
#      bash /projects/cts/jamie/vcf_pipeline/run_pipeline.sh --test-email
#      bash /projects/cts/jamie/vcf_pipeline/run_pipeline.sh --dry-run
#      bash /projects/cts/jamie/vcf_pipeline/run_pipeline.sh
#
#  1st line: checks that email works
#  2nd line: shows what would run, runs nothing
#  3rd line: the real run. It starts its own screen session called
#            vcf_<run_name>, so it keeps going after you log out.
#
#  Checking on a run (log back in to tinkercliffs2 first):
#      screen -r vcf_<run_name>
#      tail -f /projects/cts/jamie/runs/<run_name>/pipeline_console.log
# =====================================================================


# ---------------------------------------------------------------------
# 1. RUN SETUP  (change every run)
# ---------------------------------------------------------------------

# Set name for this run. 
run_name: "batch03"

# Where run folders are created
output_root: "/projects/cts/jamie/runs"

# Note: Results go to <output_root>/<run_name>/

# -------- RAW DATA & SAMPLES  --------

# Folder(s) holding the raw FASTQ files (*_R1_001.fastq.gz / *_R2_001.fastq.gz).
# You can list several folders to genotype several batches together in ONE VCF if needed.
raw_fastq_dirs:
  - "/projects/cts/jamie/raw/batch03"
#  - "/projects/cts/jamie/raw/batch04"

# Samples to leave out (e.g. failed libraries), by sample ID
exclude_samples: []
#  - "103816"

# -------- METADATA --------

# Sample metadata spreadsheet, linked by HBS number (the first number in
# the FASTQ name, e.g. 103980 in 103980_S12_L001_R1_001.fastq.gz).
# Every column in the sheet is added to sample_summary.tsv automatically.
# Save as .csv or .tsv.

# Leave metadata_file "" if there isnt one.
metadata_file: ""

# HBS/Sample ID Number ("" if none)
metadata_hbs_column: ""   

# For the QC map ("" if none)
metadata_lat_column: ""    
metadata_long_column: ""


# ---------------------------------------------------------------------
# 2. REFERENCE FILES  (set once; change only if you have a new reference or BED file)
# ---------------------------------------------------------------------
# Just point to the reference FASTA and the target BED. The pipeline:
#   - reuses the saved reference index if one exists for this reference,
#     otherwise builds it (~17 h, first run only) and saves it for next time
#   - checks the BED contig names match the reference, and sorts the BED
#     into reference order automatically

# Reference genome FASTA
reference_fasta: "/projects/cts/jamie/reference/Axo_Ref.fna"

# Target/bait regions (BED). Variants are only called inside these.
targets_bed: "/projects/cts/jamie/reference/targets_sorted.bed"

# Index reference genome if needed. 
reference_name: "Axo"   # Indexed reference genome file name; changing it rebuilds the index

# Indexed reference genome path. Set to where the indexed file already exists or where you would like the new
# file to exist after indexing. 
reference_index_dir: "/projects/cts/jamie/reference/prepared"   # Path where you want to save the new index


# ---------------------------------------------------------------------
# 3. THRESHOLDS
# ---------------------------------------------------------------------

# -------- VARIANT CALLING --------
expected_coverage: "high"  # Imput can be "high" or "low" 
        # Tells GATK HaplotypeCaller how deep your sequencing is. High (above roughly
        # 10–15x) makes it stricter about pruning weak evidence; low makes it keep more
        # borderline evidence so it doesn’t miss variants in thin data.

het_prior: 0.001                # Imput can be 0 to 1; very rarely above 0.02. (GATK default is 0.001;
        # snpArcher default is 0.005).
        
        # Starting assumption for how often a site is heterozygous.
        # Higher values make it slightly quicker to call heterozygotes (eg 0.0001 means
        # there is 1 het site per 10,000bp and the population has very low diversity
        # like that in bottlenecked or inbred populations; 0.01 means there is 1 het site
        # per 100 bp like that in a highly diverse species).
 
ploidy: 2      # Number of chromosome copies per individual.

# -------- CALLABLE-SITE COVERAGE FILTER (applied after calling) --------
callable_fraction: 1.0          # Imput can be 0 to 1; rarely below 0.8 (snpArcher default is 1.0)
        # A position counts as callable only if at least [imput]% of samples have acceptable
        # depth there. 1.0 means that 100% of samples must have acceptable depth at that
        # site). 

callable_min_coverage: "auto"   # Imput can be any postive whole number or "auto" ("auto" is default; 3-5 is
        # lenient and keeps low-coverage positions, 8-10 is common for reliable genotype
        # calls, 15-20 is strict and only keeps well-covered poisitons). 

        # The minimum depth for a sample to count at a position.
        # "auto": the minimum is set to half the average depth (eg 20x average gives a
        # 10x minimum). Adjusts to your data automatically.
        # A whole number of reads (eg 5, 10 or 20): one fixed minimum depth that applies
        # to every position.

callable_max_coverage: "auto"   # Imput can be any positive whole number or "auto" ("auto" is default; 2 is
        # common, 3 is more leniant, 10+ means there is effectively no upper limit). 
        
        # Positions with depth above the maximum are excluded, because unusually high
        # depth usually means repeats, duplicated regions or mapping errors.
        # "auto": the maximum is set to twice the average depth (eg 20x average gives a
        # 40x maximum).
        # A whole number of reads (eg 50, 100 or 200): one fixed maximum for every position.

mappability_filter: false       # Imput is true of false (false is default)
        # True generates GenMap (tool that scans the whole reference genome and scores
        # every position on how unique the surrounding sequence is; It measures how many
        # places a read starting there could match).
        # snpArcher uses GenMap scores to filter out non-unique regions.
 
        # Is currently false because out genome is gigantic and would take a massive
        # amount of memory. 

min_contig_length: 0            # Imput can be any positive whole number (0 is default; 0bp means call on every
        # contig, 1000-10000bp means skip tiny unplaced scaffolds, 100000+bp means only
        # larger contigs). 
        # Sets the minimum size for a contig to be included in variant calling. 

# -------- DEPTH SUMMARY --------
# Note: these thresholds only affect the depth summary output, not variant calling.
min_ontarget_depth: 10          # Imput can be any positive number (there is no default for our pipeline).
        # The minimum average sequencing depth over the target regions for a sample to
        # pass. A sample whose mean on-target depth is below it gets “no” in 
        # sample_summary.tsv and is listed in low_depth_samples.txt. It’s only a flag;
        # the sample is still included in the VCF.

        # Imput represents the min depth we want (5 would be lenient and keep
        # lower-coverage samples; 10 is common for reliable genotype calls; 15-20 is for 
        # high-confidence genotypes). 

depth_min_mapq: 20              # Imput can be positive whole number between 0-60 (default is 20-30).
        # Reads with mapping quality below this aren’t counted when measuring on-target
        # depth (Mapping quality (MAPQ) is how confident the aligner is that a read is in
        # the right place). 

        # Imput represents the chance the read is misplaced (0 means the read could
        # equally belong elsewhere; 10 means there is a 1 in 10 chance the read is
        # misplaced; 20 means there is 1 in 100 chance the read is misplaced).  

# -------- OPTIONAL SNPARCHER MODULES --------
qc_module: true                # Generate QC dashboard (includes PCA, relatedness, map)


# Generate clean VCF for popgen analyses:
postprocess_module: false       # Generates extra cleaned-up VCF after the main run that contains only the variants
        # that pass the post processing filters below; used for pop gen analysis. 

        # Only keeps variants that...
          # passed GATK’s hard filters (PASS)
          # fall inside the callable-sites BED (adequate, not excessive, coverage)
          # have a minor allele frequency of at least the postprocess_maf
          # aren’t missing in too many samples (postprocess_missingness)
          # aren’t on short contigs or excluded scaffolds

postprocess_maf: 0.01    # Imput can be between 0 to 0.5 (default is 0.01; 0.01-0.05 is typical). 
        # The minimum minor allele frequency for a SNP to be kept in the clean VCF. The
        # minor allele is the rarer of the two versions at a SNP (0.01 drops SNPs whose
        # rarer allele makes up less than 1% of all chromosome copies across your
        # samples). 

postprocess_missingness: 0.75  # Imput can be between 0 to 1 (default is 0.75; larger = more lenient).
        # The maximum fraction of samples allowed to be missing a genotype at a SNP.
        # Removes SNPs where more than [imput]% of samples have no genotype call (eg with
        # 0.75, a SNP is kept as long as at least 25% of samples have a genotype there).

postprocess_contig_size: 10000  # Imput can be positive whole number (default is 10000). 
        # SNPs on contigs of [imput] bp or smaller are left out of the clean VCF.

postprocess_exclude_scaffolds: ""  # Imput comma-seperated list of contig names to drop entirely from the
          # clean vcf; use contig names exactly as they appear in the reference. 


# ---------------------------------------------------------------------
# 4. CLUSTER + EMAIL  (set once)
# ---------------------------------------------------------------------

# Email for step notifications: one email per finished step, saying if
# any sample failed in that step. Leave "" for no emails.
notify_email: "jamiesuesser@vt.edu"

slurm_account: "consgen"
slurm_partition: "normal_q"
max_jobs: 100                 # max SLURM jobs at once
retries: 2                    # failed jobs retry with more memory
snparcher_conda_env: "/projects/cts/jamie/conda_env/snparcher"
